[platformio]
default_envs = espboy

[env:espboy]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    m1cr0lab/ESPboy@1.2.1
    lovyan03/LovyanGFX@0.4.18
    adafruit/Adafruit MCP4725@2.0.2
    adafruit/Adafruit MCP23017 Arduino Library@2.3.2
    adafruit/Adafruit BusIO@1.17.4
build_flags = -Wall
build_src_flags = -Wextra

[env:diagnostic]
extends = env:espboy
build_flags = ${env:espboy.build_flags} -DESPBOY_DIAGNOSTIC

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror
test_build_src = no

; Play the shared game/screens on this computer; no ESPBoy or USB required.
[env:desktop]
platform = native@1.2.1
build_flags = -std=c++11 -Wall -Wextra -DPOCKET_POKER_DESKTOP
extra_scripts = pre:scripts/desktop_build.py
